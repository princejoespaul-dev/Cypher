[importlinter]
root_package = cypher

[importlinter:contract:core-independent]
name = Core has no dependencies on application modules
type = forbidden
source_modules = cypher.core
forbidden_modules = cypher.api, cypher.capsules, cypher.targets, cypher.sandbox, cypher.evidence, cypher.harness, cypher.guidance, cypher.history, cypher.experiments, cypher.workers

[importlinter:contract:advisory-outside-verdict-path]
name = Advisory AI modules cannot import into the deterministic harness or database
type = forbidden
source_modules = cypher.guidance, cypher.history
forbidden_modules = cypher.harness.adjudicator, cypher.harness.executor, cypher.sandbox, cypher.api
