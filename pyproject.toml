[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cypher-backend"
version = "0.1.0"
description = "Sandbox-only invariant-linked authorization replay and evidence platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "UNLICENSED - research prototype" }
authors = [{ name = "CYPHER / Ascendants" }]
dependencies = [
  "fastapi==0.128.2",
  "pydantic==2.13.5",
  "sqlalchemy==2.0.50",
  "uvicorn==0.40.0",
  "alembic==1.17.2",
  "psycopg[binary]==3.2.12",
  "httpx==0.28.1",
  "redis==6.4.0",
  "docker==7.1.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "hypothesis==6.148.2"]
quality = ["ruff==0.14.7", "mypy==1.19.0", "import-linter==2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = ["tests/", "migrations/"]

[tool.importlinter]
root_packages = ["cypher"]
include_external_packages = true
