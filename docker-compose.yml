name: cypher-local
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cypher
      POSTGRES_USER: cypher
      POSTGRES_PASSWORD: cypher-local-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["cypher_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cypher -d cypher"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks: [default]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cypher-local
      MINIO_ROOT_PASSWORD: change-this-local-password
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["cypher_minio:/data"]

  api:
    build: .
    environment:
      CYPHER_ENV: development
      CYPHER_API_KEY: dev-only-change-me
      CYPHER_DATABASE_URL: postgresql+psycopg://cypher:cypher-local-only@postgres:5432/cypher
      CYPHER_REDIS_URL: redis://redis:6379/0
      CYPHER_SANDBOX_SUBNETS: 172.28.0.0/16,172.30.0.0/24
      CYPHER_EVIDENCE_DIR: /var/lib/cypher/evidence
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["cypher_evidence:/var/lib/cypher/evidence"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [default, sandbox]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  reference-vulnerable:
    profiles: ["sandbox"]
    build: ./targets/reference_api
    environment: { CYPHER_VARIANT: vulnerable }
    networks: [sandbox]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  reference-fixed:
    profiles: ["sandbox"]
    build: ./targets/reference_api
    environment: { CYPHER_VARIANT: fixed }
    networks: [sandbox]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  default: {}
  sandbox:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  cypher_pgdata: {}
  cypher_minio: {}
  cypher_evidence: {}
